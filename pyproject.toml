[project]
name = "tracecat-k8s"
version = "0.1.0"
description = "Juju charm for Tracecat — open-source SOAR platform"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

# Dependencies of the charm code in src/. Charm libraries from Charmhub are
# fetched via `charmcraft fetch-lib` into lib/. Their PYDEPS are listed here.
dependencies = [
    "ops~=3.7",
    "cryptography>=42.0",
    "pydantic>=2.0",
    "cosl>=0.0.53",
    "jsonschema>=4.0",
]

[dependency-groups]
lint = [
    "ruff>=0.16.0",
    "codespell>=2.3",
    "pyright>=1.1.350",
    "zizmor>=1.28.0",
]
unit = [
    "coverage[toml]>=7.4",
    "ops[testing]>=3.7",
    "pytest>=8.0",
]
integration = [
    "jubilant>=0.6",
    "pytest>=8.0",
    "PyYAML>=6.0",
]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true

fail_under = 88
[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
testpaths = ["tests"]
pythonpath = ["src", "lib"]

[tool.codespell]
skip = "build,lib,venv,.tox,.git,.mypy_cache,.ruff_cache,.coverage"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["lib", "src"]

[tool.ruff]
line-length = 99
extend-exclude = [
    "lib",
    "__pycache__",
    "*.egg_info",
    "build",
]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "C4",
    "N",
    "D",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S108", "PLR2004", "ARG", "SLF001", "N802", "N803", "N806", "D"]
"lib/*" = ["D", "E", "W", "F", "C", "N", "I001", "UP", "B", "ANN"]
