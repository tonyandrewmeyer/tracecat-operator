[project]
name = "tracecat-operator"
version = "0.1.0"
description = "Juju charm for Tracecat — open-source SOAR platform"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Canonical Ltd." }]
dependencies = [
  "ops>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "jubilant>=0.1",
  "ops[testing]>=3.0",
  "mypy>=1.10",
  "ruff>=0.4",
  "pre-commit>=3.7",
  "coverage>=7.4",
]

[tool.ruff]
line-length = 99
target-version = "py312"
extend-exclude = ["lib", ".tox"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "ANN"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"lib/*" = ["ANN", "E", "F", "W", "I", "N", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/"]
exclude = ["lib/", "tests/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
