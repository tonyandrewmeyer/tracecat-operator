name: Charmhub upload

on:
  push:
    tags: ['*']

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
      - run: sudo snap install charmcraft --classic
      - run: charmcraft pack
      - uses: canonical/charmcraft-actions/auth@v3
        with:
          credentials: ${{ secrets.CHARMHUB_TOKEN }}
      - uses: canonical/charmcraft-actions/upload@v3
        with:
          charm-name: tracecat-k8s
          # track: 1.0/stable  # uncomment to publish; left commented to
          #                     # upload-only (stays in unpublished state).
