name: Charmhub upload

on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: sudo snap install charmcraft --classic
      - run: charmcraft pack
      # Upload only: the revision stays unpublished until it is released to a
      # channel manually (or by uncommenting the `charmcraft release` below).
      - name: Upload charm to Charmhub
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
        run: |
          charmcraft upload tracecat-k8s_*.charm
          # charmcraft release tracecat-k8s --revision "$REVISION" --channel 1.0/stable
