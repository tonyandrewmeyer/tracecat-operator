name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras
      - run: uv run pre-commit run --all-files

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras
      - run: uv run pytest tests/unit -v --cov

  # Integration tests run only on push to main or manual dispatch to avoid
  # consuming cloud resources on every PR.
  integration-tests:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: charmed-kubernetes/actions-runner@v0
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras
      - run: charmcraft pack
      - run: uv run pytest tests/integration -v
